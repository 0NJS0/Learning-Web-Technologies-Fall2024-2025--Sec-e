<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

</head>
<body>
    <h1>Signup Form</h1>

        <form method="post" action="../controller/signupCheck.php" onsubmit="return validateForm()">
            <table>
                <tr>
                    <th colspan="2">Personal Information</th>
                </tr>
                <tr>
                    <td>UserName:</td>
                    <td><input type="text" name="username" id="username" value=""  /></td>
                </tr>
                <tr>
                    <td>Author Name:</td>
                    <td><input type="text" name="fullname" id="fullname" value=""  /></td>
                </tr>
                <tr>
                    <td>Contact Number:</td>
                    <td><input type="text" name="phone" id="phone" value="" /></td>
                </tr>

                <tr>
                    <th colspan="2">Security Information</th>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" id="password" value=""  /></td>
                </tr>
                <tr>
                    <td>Confirm Password:</td>
                    <td><input type="password" name="confirmpassword" id="confirmPassword" value=""  /></td>
                </tr>
                <tr>
                    <td colspan="2" class="security-info">
                        <input type="submit" name="submit" value="Submit" />
                    </td>
                </tr>
            </table>
        </form>
</body>
</html>

<script>
    function validateForm() {
        let username = document.getElementById('username').value.trim();
        let fullname = document.getElementById('fullname').value.trim();
        let password = document.getElementById('password').value;
        let confirmPassword = document.getElementById('confirmPassword').value;


        if (username === "") {
        alert("Username is required.");
        return false;
        }

        if (fullname === "") {
            alert("Full name is required.");
            return false;
        }




        if (password === "") {
            alert("Password is required.");
            return false;
        }

        if (confirmPassword === "") {
            alert("Confirm password is required.");
            return false;
        }

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return false;
        }

    alert("Registration successfully!");
    return true;
}

</script>
